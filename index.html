
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric.js & jQuery Drawing Demo</title>
    <!-- 引入 TailwindCSS 用于快速样式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- 引入 Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .canvas-container {
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border-radius: 0.5rem;
            margin: 0 auto;
        }
        .tool-btn {
            transition: all 0.2s;
        }
        .tool-btn:hover {
            transform: translateY(-2px);
        }
        .tool-btn.active {
            background-color: #3b82f6;
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 头部导航 -->
    <header class="bg-white shadow-sm py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800"><i class="fas fa-paint-brush text-blue-500 mr-2"></i>Fabric.js Designer</h1>
            <div class="space-x-4">
                <button id="btn-clear" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 transition shadow">
                    <i class="fas fa-trash-alt mr-1"> Clear Canvas
                
                <button id="btn-download" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition shadow">
                    <i class="fas fa-download mr-1"> Save Image
                </button>
            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="flex-grow container mx-auto px-4 py-8 flex flex-col md:flex-row gap-6">
        
        <!-- 左侧工具栏 -->
        <aside class="w-full md:w-64 bg-white p-6 rounded-lg shadow-md h-fit">
            <h2 class="text-lg font-semibold mb-4 text-gray-700 border-b pb-2">Tools</h2>
            
            <!-- 形状工具 -->
            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Shapes</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button class="tool-btn w-full py-2 border rounded text-gray-700 hover:bg-gray-50" data-shape="rect">
                        <i class="far fa-square"></i> Rectangle
                    </button>
                    <button class="tool-btn w-full py-2 border rounded text-gray-700 hover:bg-gray-50" data-shape="circle">
                        <i class="far fa-circle"></i> Circle
                    </button>
                    <button class="tool-btn w-full py-2 border rounded text-gray-700 hover:bg-gray-50" data-shape="triangle">
                        <i class="fas fa-play" style="transform: rotate(-90deg);"></i> Triangle
                    </button>
                </div>
            </div>

            <!-- 文本工具 -->
            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Text</h3>
                <button id="btn-add-text" class="tool-btn w-full py-2 border rounded text-gray-700 hover:bg-gray-50">
                    <i class="fas fa-font"></i> Add Text
                </button>
            </div>

            <!-- 图片上传 -->
            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Image</h3>
                <label class="tool-btn w-full py-2 border rounded text-gray-700 hover:bg-gray-50 flex items-center justify-center cursor-pointer">
                    <i class="fas fa-image mr-2"></i> Upload Image
                    <input type="file" id="img-upload" accept="image/*" class="hidden">
                </label>
            </div>

            <!-- 属性控制 -->
            <div class="mb-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Properties</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Fill Color</label>
                        <input type="color" id="color-picker" value="#3b82f6" class="w-full h-10 rounded cursor-pointer">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-600 mb-1">Opacity</label>
                        <input type="range" id="opacity-slider" min="0.1" max="1" step="0.1" value="1" class="w-full">
                    </div>
                    <button id="btn-delete" class="w-full py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition">
                        <i class="fas fa-times"></i> Delete Selected
                    </button>
                </div>
            </div>
        </aside>

        <!-- 画布区域 -->
        <section class="flex-grow flex justify-center items-start">
            <div class="canvas-container relative">
                <canvas id="c" width="800" height="600"></canvas>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer class="bg-white py-4 mt-auto">
        <div class="container mx-auto px-4 text-center text-gray-500 text-sm">
            <p>Powered by Fabric.js & jQuery | Ready for GitHub Pages</p>
        </div>
    </footer>

    <!-- 逻辑脚本 -->
    <script src="app.js"></script>
</body>
</html>
